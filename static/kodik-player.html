<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Видеоплеер</title>
  <link rel="stylesheet" href="/static/kodik-player.css">
  <script src="/static/vendor/hls.light.min.js" defer></script>
  <script src="/static/kodik-player.js" defer></script>
</head>
<body>
  <main id="player" class="player is-empty is-loading">
    <video controls playsinline webkit-playsinline preload="metadata"></video>
    <div class="player-bar" role="group" aria-label="Управление видео">
    <button id="resume" class="resume" type="button" hidden></button>
    <button id="skip-intro" class="skip-intro" type="button" hidden>Пропустить заставку</button>
    <div class="feedback">
      <div id="message" class="message" role="status">Загружаем видео…</div>
      <button id="feedback-close" class="feedback-close" type="button" aria-label="Закрыть сообщение" title="Закрыть сообщение" hidden>×</button>
      <div class="recovery">
        <button id="retry" type="button" hidden>Попробовать ещё раз</button>
        <button id="original" type="button" hidden>Обычный плеер с рекламой</button>
      </div>
    </div>
    <details id="player-settings" class="player-settings" hidden>
      <summary id="settings-toggle" aria-label="Настройки видео" title="Настройки видео">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.1 13.4 1.3 1-1.5 2.6-1.6-.6a7.8 7.8 0 0 1-2.4 1.4l-.3 1.7h-3l-.3-1.7a7.8 7.8 0 0 1-2.4-1.4l-1.6.6-1.5-2.6 1.3-1a8 8 0 0 1 0-2.8l-1.3-1 1.5-2.6 1.6.6a7.8 7.8 0 0 1 2.4-1.4l.3-1.7h3l.3 1.7a7.8 7.8 0 0 1 2.4 1.4l1.6-.6 1.5 2.6-1.3 1a8 8 0 0 1 0 2.8Z"/></svg>
        <span id="settings-quality"></span>
      </summary>
      <div class="settings-panel">
        <div class="settings-heading"><strong>Настройки видео</strong><button id="settings-close" type="button" aria-label="Закрыть настройки">×</button></div>
        <label id="translation-label" class="setting-row" for="translation" hidden><span>Озвучка</span><select id="translation" aria-label="Озвучка" hidden disabled></select></label>
        <label class="setting-row" for="quality"><span>Качество</span><select id="quality" disabled aria-label="Качество видео"></select></label>
        <button id="pip" class="setting-action" type="button" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="15" rx="2"/><rect x="11" y="11" width="8" height="6" rx="1"/></svg><span id="pip-label">Картинка в картинке</span></button>
      </div>
    </details>
    </div>
  </main>
  <noscript>Для воспроизведения включите JavaScript.</noscript>
</body>
</html>
